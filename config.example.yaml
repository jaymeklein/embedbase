# EmbedBase configuration
# Copy to config.yaml and edit. All settings here can be changed at runtime
# via PUT /config without restarting the stack.

embedding:
  provider: ollama  # ollama | sentence_transformers | openai_compat | gemini
  model: embeddinggemma  # 768-dim, multilingual; needs `ollama pull embeddinggemma`
  batch_size: 32
  # Ollama settings (provider: ollama)
  # base_url: http://host.docker.internal:11434
  # concurrency: 8
  # OpenAI-compatible settings (provider: openai_compat)
  # base_url: http://host.docker.internal:1234
  # api_key: ""
  # Gemini settings (provider: gemini) — model e.g. gemini-embedding-2
  # api_key: ""                       # required: Google AI Studio API key
  # output_dimensionality: 768        # optional: truncate 3072-dim output

vector_store:
  host: postgres
  port: 5432
  database: embedbase
  user: embedbase
  # password: set via POSTGRES_PASSWORD env var
  index_min_rows: 100   # create HNSW index after this many rows

chunking:
  sliding_window:
    max_tokens: 512
    overlap_tokens: 64
  csv:
    rows_per_chunk: 10
  code:
    max_symbol_tokens: 4096
    fallback_window_lines: 50

parsers:
  # pdf_backend: pymupdf     # leave unset and the Settings UI pre-selects from the
                             # detected GPU (docling on Ampere+, else pymupdf); once
                             # you pick one it's saved. "pymupdf" (fast) | "docling" (OCR + tables)
  docling_ocr: false         # OCR scanned / image-only pages
  docling_ocr_engine: easyocr  # "easyocr" | "tesseract" | "rapidocr"
  docling_tables: true       # recognise table structure (emitted as Markdown)
  # docling_artifacts_path:         # local docling models dir; env override: DOCLING_ARTIFACTS_PATH
  # --- GPU acceleration — auto-detected, no config needed ---------------------
  # docling_device defaults to "auto": it detects an NVIDIA GPU and sets the
  # device, flash attention (Ampere+/RTX 30-40 only), and batch sizes for you.
  # Override only to pin behaviour:
  # docling_device: cuda            # "auto" (default) | "cpu" | "cuda"
  # docling_flash_attention: false  # ignored under "auto"; Ampere-only
  # docling_ocr_batch_size: 64      # ignored under "auto" (picks 64 on GPU)
  # docling_layout_batch_size: 64
# .docx and .pptx are always parsed by docling (no lightweight adapter exists).

search:
  default_top_k: 5
  max_top_k: 20
  retrieval_fan_out: 4    # retrieve top_k * fan_out before applying filters
  max_fan_out: 10
  hybrid_default_alpha: 0.7  # 0.0 = BM25 only, 1.0 = semantic only
  # A2 adjacency expansion: after the top_k cut, pull neighbour chunks around each hit and merge
  # contiguous runs into one span, so a section that spilled past top_k comes back whole.
  expand_neighbors: 1        # chunks pulled on EACH side of a hit; 0 = off
  max_expand_neighbors: 5    # clamp ceiling for expand_neighbors (also the UI's max)
  expand_char_budget: 8000   # soft cap on an assembled span's text (farthest neighbours dropped first)

mcp:
  enabled: true
  rate_limit_rpm: 60
  max_results: 20

# Upload size cap (MB). Editable in the config page.
max_file_size_mb: 50

# Object storage for uploaded files. Default is local disk (the upload volume);
# nothing below is needed to run. To use S3-compatible storage, uncomment a
# backend and point `default:` at it — each document records the backend that
# holds it, so several can coexist and switching never orphans old files.
# Secrets come from .env as S3__<NAME>__ACCESS_KEY_ID / __SECRET_ACCESS_KEY.
# storage:
#   default: local           # backend new uploads go to (default = local disk)
#   backends:
#     local:
#       type: local          # files under the upload volume; always available
#     minio:                 # bundled MinIO — see docker-compose.minio.yml
#       type: s3
#       endpoint_url: http://minio:9000            # in-cluster address (api/worker → minio)
#       public_endpoint_url: http://localhost:9000 # address the browser reaches (signs presigned URLs)
#       bucket: embedbase
#       region: us-east-1
#       use_path_style: true
#     aws:                   # external AWS S3 — no container, pure config
#       type: s3
#       bucket: my-prod-bucket
#       region: eu-west-1

# NOTE: logging (LOG_LEVEL / LOG_FORMAT), the Celery broker (REDIS_URL), the
# SQLite path (DATABASE_PATH), CORS, ports and the master key are deploy/bootstrap
# settings and live in .env, not here.
