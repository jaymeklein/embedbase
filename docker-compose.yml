networks:
  embedbase_net:
    driver: bridge

volumes:
  embedbase_data:
  redis_data:
  postgres_data:

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: embedbase/api:1.0.0
    environment:
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embeddinggemma}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-embedbase}
      - POSTGRES_USER=${POSTGRES_USER:-embedbase}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-embedbase}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-embedbase}
      - MASTER_API_KEY=${MASTER_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - EMBEDBASE_SECURE_HEADERS=${EMBEDBASE_SECURE_HEADERS:-false}
      # LAN IP the console advertises for other devices. A bridge-networked
      # container can't detect the host's LAN IP, so set LAN_HOST in .env to a
      # fixed value; blank falls back to in-container socket detection.
      - LAN_HOST=${LAN_HOST:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_CONCURRENCY=${OLLAMA_CONCURRENCY:-8}
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-http://host.docker.internal:1234}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - DOCLING_ARTIFACTS_PATH=${DOCLING_ARTIFACTS_PATH:-}
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/api
    volumes:
      - embedbase_data:/data
      - ./data/store:/store
      - ./config.yaml:/app/config.yaml
      - ./api:/app/api   # bind-mount: edits on host are visible instantly; --reload picks them up
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [embedbase_net]

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: embedbase/worker:1.0.0
    environment:
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embeddinggemma}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-embedbase}
      - POSTGRES_USER=${POSTGRES_USER:-embedbase}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-embedbase}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-embedbase}
      - MASTER_API_KEY=${MASTER_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_CONCURRENCY=${OLLAMA_CONCURRENCY:-8}
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-http://host.docker.internal:1234}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - DOCLING_ARTIFACTS_PATH=${DOCLING_ARTIFACTS_PATH:-}
    # -B runs Celery's embedded beat in-process (fires the temporary-document purge
    # sweep). Safe with this single --concurrency=1 worker; see worker/celery_app.py.
    command: watchfiles "celery -A worker.celery_app worker -B --loglevel=info --concurrency=1" /app/worker
    volumes:
      - embedbase_data:/data
      - ./data/store:/store
      - ./config.yaml:/app/config.yaml
      - ./worker:/app/worker   # bind-mount: watchfiles restarts celery on any .py change
      - ./api:/app/api         # shared package imported by the worker pipeline
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [embedbase_net]

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [embedbase_net]

  postgres:
    # ParadeDB bundles pgvector + pg_search (real BM25) in one Postgres image, so
    # vectors, relational metadata, and lexical search all share this instance.
    image: paradedb/paradedb:latest
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-embedbase}
      - POSTGRES_USER=${POSTGRES_USER:-embedbase}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      # Expose the DB to the host so a Postgres GUI (DBeaver/pgAdmin/TablePlus) can
      # attach. Bound to 127.0.0.1 so it's reachable locally but never on the LAN.
      # Override POSTGRES_HOST_PORT if 5432 is already taken by a local Postgres.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PG18+ images (ParadeDB is PG18) store data in a version-specific subdir and
      # want the mount at /var/lib/postgresql, not /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-embedbase}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [embedbase_net]

  nginx:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      - api
    networks: [embedbase_net]
