components:
  schemas:
    APIKeyCreate:
      properties:
        label:
          type: string
          title: Label
          default: ''
      type: object
      title: APIKeyCreate
      description: Body for POST /workspaces/{ws_id}/collections/{col_id}/keys.
    AppConfig:
      properties:
        embedding:
          $ref: '#/components/schemas/EmbeddingConfig'
          default:
            provider: ollama
            model: embeddinggemma
            batch_size: 32
            concurrency: 8
            max_rpm: 0
        reranker:
          $ref: '#/components/schemas/RerankerConfig'
          default:
            enabled: true
            provider: cross_encoder
            model: cross-encoder/ms-marco-MiniLM-L6-v2
            llm_provider: gemini
            top_n: 50
            timeout_seconds: 60.0
        vector_store:
          $ref: '#/components/schemas/VectorStoreConfig'
          default:
            host: postgres
            port: 5432
            database: embedbase
            user: embedbase
            password: ''
            index_min_rows: 100
        chunking:
          $ref: '#/components/schemas/ChunkingConfig'
          default:
            sliding_window:
              max_tokens: 512
              overlap_tokens: 64
        parsers:
          $ref: '#/components/schemas/ParserConfig'
          default:
            docling_ocr: false
            docling_ocr_engine: easyocr
            docling_tables: true
            docling_device: auto
            docling_flash_attention: false
            docling_ocr_batch_size: 8
            docling_layout_batch_size: 8
        search:
          $ref: '#/components/schemas/SearchConfig'
          default:
