          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - documents
      summary: List Documents
      description: 'List documents in a collection: paginated, filtered, newest-first,
        with latest status.


        Returns ``{items, total, limit, offset}``. All filters are optional and AND-combined;

        ``filename`` is a case-insensitive substring, ``status`` is the latest ingestion
        status,

        ``indexed`` gates on stored chunks, and the ``*_size``/``*_after``/``*_before``
        bounds are

        inclusive. See :class:`DocumentListQuery` for the full set of query parameters.'
      operationId: list_documents_workspaces__ws_id__collections__col_id__documents_get
      parameters:
      - name: ws_id
        in: path
        required: true
        schema:
          type: string
          title: Ws Id
      - name: col_id
        in: path
        required: true
        schema:
          type: string
          title: Col Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: filename
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
      - name: file_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: File Type
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: indexed
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Indexed
      - name: embedding_model
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Embedding Model
      - name: storage_backend
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Storage Backend
      - name: min_size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Min Size
      - name: max_size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Max Size
      - name: created_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Created After
      - name: created_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Created Before
      - name: updated_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated After
      - name: updated_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated Before
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Tag
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
