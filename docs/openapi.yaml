  /search:
    post:
      tags:
      - search
      summary: Search
      description: "Run a hybrid (semantic + BM25) search across one or more collections.\n\
        \nThe request's ``collection_ids`` are narrowed to those the caller may read\n\
        (master sees all; a user sees the collections their grants cover). Searching\n\
        only unauthorized collections yields ``403``.\n\nArgs:\n    request: Search\
        \ parameters including query, collection IDs, and filters.\n    db: Injected\
        \ async database session for collection metadata.\n    principal: Authenticated\
        \ caller (master or user key).\n    embedder: Embedding adapter injected via\
        \ Depends.\n    vector_store: Vector store adapter injected via Depends (also\
        \ does FTS).\n    reranker: Optional cross-encoder reranker (None when disabled/not\
        \ loaded).\n    search_config: Live search config (supplies the A2 adjacency-expansion\
        \ window).\n\nReturns:\n    SearchResponse with ranked results and per-collection\
        \ stats."
      operationId: search_search_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
