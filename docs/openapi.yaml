  /ingestion/jobs/retry-failed:
    post:
      tags:
      - jobs
      summary: Retry Failed Jobs
      description: 'Re-enqueue every currently-failed document matching the given
        filters — the queue''s bulk

        "retry all errors". Targets documents whose *latest* ingestion attempt failed;
        the ``status``

        filter is ignored (forced to failed) while the other filters (filename, file_type,
        collection,

        created range) scope the set exactly like the listing. Idempotent per document.


        Returns ``{"retried": n}`` — how many documents were re-enqueued.'
      operationId: retry_failed_jobs_ingestion_jobs_retry_failed_post
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: filename
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
      - name: file_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: File Type
      - name: collection
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Collection
      - name: created_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Created After
      - name: created_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Created Before
      - name: authorization
        in: header
        required: false
