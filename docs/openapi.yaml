            max_results: 20
        storage:
          $ref: '#/components/schemas/StorageConfig'
          default:
            default: local
            backends:
              local:
                type: local
            temp_retention_hours: 0
        max_file_size_mb:
          type: integer
          title: Max File Size Mb
          default: 50
      type: object
      title: AppConfig
