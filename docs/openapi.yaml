  /ingestion/jobs:
    get:
      tags:
      - jobs
      summary: List Jobs
      description: 'List ingestion jobs across all collections: paginated, filtered,
        newest-first.


        Returns ``{items, total, limit, offset}``. All filters are optional and AND-combined;

        ``filename`` and ``collection`` are case-insensitive substrings, ``status``
        and ``file_type``

        are exact, and the ``created_*`` bounds are inclusive ISO-8601 (a date-only
        ``created_before``

        covers the whole day). See :class:`JobListQuery` for the full set of query
        parameters.'
      operationId: list_jobs_ingestion_jobs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: status
        in: query
        required: false
