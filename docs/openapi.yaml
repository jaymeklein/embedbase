          type: array
          title: Edges
        tag_counts:
          additionalProperties:
            type: integer
          type: object
          title: Tag Counts
        max_heat:
          type: integer
          title: Max Heat
      type: object
      required:
      - nodes
      - edges
      - tag_counts
      - max_heat
      title: GraphResponse
      description: "The graph for a scope: nodes, edges, and a heat summary.\n\nAttributes:\n\
        \    nodes: File nodes followed by tag hub nodes.\n    edges: One ``file →\
        \ tag`` edge per tag a file carries.\n    tag_counts: Tag name → number of\
        \ files carrying it.\n    max_heat: Largest single tag usage count (``0``\
        \ when there are no tags)."
