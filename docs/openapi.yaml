  /workspaces/{ws_id}/collections/{col_id}/documents:
    post:
      tags:
      - documents
      summary: Upload Document
      description: 'Upload and enqueue a document for ingestion.


        Accepted formats: PDF, TXT, and Markdown; DOCX and PPTX also require the docling

        parser backend (``parsers.pdf_backend: docling``). Set ``temporary`` to auto-purge

        the document after ``storage.temp_retention_hours`` (no-op when 0).'
      operationId: upload_document_workspaces__ws_id__collections__col_id__documents_post
      parameters:
      - name: ws_id
        in: path
        required: true
        schema:
          type: string
          title: Ws Id
      - name: col_id
        in: path
        required: true
        schema:
          type: string
          title: Col Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_workspaces__ws_id__collections__col_id__documents_post'
