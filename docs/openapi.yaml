      title: GraphNode
      description: "A graph node: a file (document) or a tag hub.\n\nAttributes:\n\
        \    id: Document id for files, tag id for tag hubs.\n    label: Display name\
        \ (filename or tag name).\n    kind: ``\"file\"`` or ``\"tag\"``.\n    heat:\
        \ Tag usage count for tag hubs; ``0`` for files.\n    heat_pct: ``heat / max_heat``\
        \ in ``[0, 1]`` (``0`` when there is no heat).\n    degree: Number of incident\
        \ edges.\n    meta: Kind-specific extras (file: ``file_type``; tag: ``color``)."
    GraphResponse:
      properties:
        nodes:
          items:
            $ref: '#/components/schemas/GraphNode'
