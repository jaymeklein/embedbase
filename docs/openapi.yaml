          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ingestion/jobs/retry-failed:
    post:
      tags:
      - jobs
      summary: Retry Failed Jobs
      description: 'Re-enqueue every currently-failed document matching the given
        filters — the queue''s bulk

        "retry all errors". Targets documents whose *latest* ingestion attempt failed;
        the ``status``

        filter is ignored (forced to failed) while the other filters (filename, file_type,
        collection,

        created range) scope the set exactly like the listing. Idempotent per document.


        Returns ``{"retried": n}`` — how many documents were re-enqueued.'
