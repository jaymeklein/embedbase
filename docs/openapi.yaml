components:
  schemas:
    AppConfig:
      properties:
        embedding:
          $ref: '#/components/schemas/EmbeddingConfig'
          default:
            provider: ollama
            model: embeddinggemma
            batch_size: 32
            concurrency: 8
            max_rpm: 0
        reranker:
          $ref: '#/components/schemas/RerankerConfig'
          default:
            enabled: true
            provider: cross_encoder
            model: cross-encoder/ms-marco-MiniLM-L6-v2
            llm_provider: gemini
            top_n: 50
            timeout_seconds: 60.0
        vector_store:
          $ref: '#/components/schemas/VectorStoreConfig'
          default:
            host: postgres
            port: 5432
            database: embedbase
            user: embedbase
            password: ''
            index_min_rows: 100
        chunking:
          $ref: '#/components/schemas/ChunkingConfig'
          default:
            sliding_window:
              max_tokens: 512
              overlap_tokens: 64
        parsers:
          $ref: '#/components/schemas/ParserConfig'
          default:
            docling_ocr: false
            docling_ocr_engine: easyocr
            docling_tables: true
            docling_device: auto
            docling_flash_attention: false
            docling_ocr_batch_size: 8
            docling_layout_batch_size: 8
        search:
          $ref: '#/components/schemas/SearchConfig'
          default:
            default_top_k: 5
            max_top_k: 20
            retrieval_fan_out: 4
            max_fan_out: 10
            hybrid_default_alpha: 0.7
            expand_neighbors: 1
            max_expand_neighbors: 5
            expand_char_budget: 8000
        mcp:
          $ref: '#/components/schemas/MCPConfig'
          default:
            enabled: true
            rate_limit_rpm: 60
            max_results: 20
        storage:
          $ref: '#/components/schemas/StorageConfig'
          default:
            default: local
            backends:
              local:
                type: local
            temp_retention_hours: 0
        max_file_size_mb:
          type: integer
          title: Max File Size Mb
          default: 50
      type: object
      title: AppConfig
    Body_upload_document_flat_documents_post:
      properties:
        collection_id:
          type: string
          title: Collection Id
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        retention_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retention Days
      type: object
      required:
      - collection_id
      - file
      title: Body_upload_document_flat_documents_post
    Body_upload_document_workspaces__ws_id__collections__col_id__documents_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        retention_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retention Days
      type: object
      required:
      - file
      title: Body_upload_document_workspaces__ws_id__collections__col_id__documents_post
    ChangePasswordRequest:
      properties:
        current_password:
          type: string
          title: Current Password
        new_password:
          type: string
          minLength: 12
          title: New Password
      type: object
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
      description: 'Body for ``POST /auth/change-password``.


        ``new_password`` must meet the minimum length; ``current_password`` is the

        temp password (first login) or the existing one (voluntary change).'
    ChunkingConfig:
      properties:
        sliding_window:
          $ref: '#/components/schemas/SlidingWindowConfig'
          default:
            max_tokens: 512
            overlap_tokens: 64
      type: object
      title: ChunkingConfig
    CollectionCreate:
      properties:
