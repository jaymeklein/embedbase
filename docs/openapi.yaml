  /documents/{doc_id}/reprocess:
    post:
      tags:
      - documents
      summary: Reprocess Document Flat
      description: 'Re-enqueue a document''s ingestion — the manual retry for a failed
        file. Reuses the stored

        bytes (nothing is re-uploaded) and surfaces a fresh pending job in the queue.'
