  /ingestion/jobs:
    get:
      tags:
      - jobs
      summary: List Jobs
      description: 'List ingestion jobs: paginated, filtered, newest-first, scoped
        to the caller''s grants.


        A non-admin sees only jobs in collections their grants can read; master/admin
        see every

        collection. Returns ``{items, total, limit, offset}``. All filters are optional
        and

        AND-combined; ``filename`` and ``collection`` are case-insensitive substrings,
        ``status`` and

        ``file_type`` are exact, and the ``created_*`` bounds are inclusive ISO-8601
        (a date-only

        ``created_before`` covers the whole day). See :class:`JobListQuery` for the
        full parameter set.'
      operationId: list_jobs_ingestion_jobs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: filename
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
      - name: file_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: File Type
      - name: collection
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Collection
      - name: collection_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Collection Id
      - name: created_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Created After
      - name: created_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Created Before
      - name: authorization
