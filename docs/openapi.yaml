  /ingestion/jobs/stats:
    get:
      tags:
      - jobs
      summary: Job Stats
      description: 'Live queue totals for the header: per-status job counts plus the
        global embedding-quota

        backoff, so the UI can show a real depth that *drains* (not the accumulating
        WebSocket buffer)

        and explain when ingestion is paused waiting on a provider rate limit.


        The counts are grant-scoped (a non-admin totals only their readable collections);
        the pause is

        global. Returns ``{"counts": {status: n, ...}, "paused_seconds": n}`` (``paused_seconds``
        0 = running).'
      operationId: job_stats_ingestion_jobs_stats_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-API-Key
        in: header
        required: false
