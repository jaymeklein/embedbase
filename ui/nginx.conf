server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # MCP server (streamable-HTTP transport), reached at /api/mcp through this proxy.
    # The API mounts MCP under its root_path, so it lives at /api/mcp (with the prefix,
    # unlike the REST routes) — this block forwards the path VERBATIM (no trailing URI
    # on proxy_pass), whereas the generic /api/ block below strips the prefix. `^~`
    # makes this prefix win over any regex and beats /api/. Buffering is off so a
    # streamed response is never held back.
    location ^~ /api/mcp {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    # Realtime WebSocket bridge (ingestion progress). The HTTP 101 upgrade needs
    # the Upgrade/Connection headers; no trailing slash so the API still sees /ws.
    location /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
